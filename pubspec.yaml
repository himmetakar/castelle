name: castelle
description: "Castelle - Premium Casting Agency SaaS Platform"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Firebase Core
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # State Management
  provider: ^6.1.4

  # Navigation
  go_router: ^15.1.2

  # Video & Media
  video_player: ^2.9.5
  image_picker: ^1.1.2
  video_compress: ^3.1.3
  chewie: ^1.10.0
  camera: ^0.10.6
  just_audio: ^0.9.40


  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  flutter_local_notifications: ^19.2.1
  http: ^1.6.0
  file_picker: ^8.0.0
  pdf: ^3.11.1
  dio: ^5.7.0
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  shaders:
    - shaders/shader.frag
